<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061a22">
  <title>Faeria — волшебный лес</title>
  <style>
    :root { color-scheme: dark; --text:#f0fcf9; --muted:rgba(240,252,249,.7); --line:rgba(230,255,252,.22); }
    * { box-sizing:border-box }
    html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#071923;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text) }
    #world,#glow {position:fixed;inset:0;width:100%;height:100%;display:block}
    #world { touch-action:none; cursor:grab; background:#071923; }
    #world:active { cursor:grabbing; }
    #glow { pointer-events:none; }
    .vignette {position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(3,14,22,.48),transparent 26%,transparent 65%,rgba(3,14,22,.55) 100%),radial-gradient(circle at 50% 42%,transparent 20%,rgba(0,14,22,.27) 100%)}
    header {position:fixed;top:0;left:0;right:0;padding:calc(19px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 10px max(20px,env(safe-area-inset-left));display:flex;align-items:flex-start;justify-content:space-between;gap:12px;z-index:10}
    .brand {display:flex;gap:12px;align-items:center;text-shadow:0 1px 14px #102d3d;}
    .mark {font-family:Georgia,serif;display:grid;place-items:center;font-size:27px;font-style:italic;width:37px;height:37px;border:1px solid rgba(250,244,220,.55);border-radius:50%;background:rgba(7,37,47,.17);box-shadow:inset 0 0 22px rgba(215,255,242,.15)}
    .brand strong{display:block;font-size:14px;letter-spacing:.27em;font-weight:650}
    .brand span{display:block;font-size:10px;letter-spacing:.20em;color:rgba(251,252,248,.74);margin-top:4px;text-transform:uppercase}
    .controls {display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
    button {border:1px solid var(--line);color:var(--text);border-radius:999px;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);background:rgba(3,28,40,.42);font-size:12px;font-weight:550;padding:10px 14px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 23px rgba(0,0,0,.09);transition:background .2s,border .2s}
    button:hover { background:rgba(15,62,72,.69) }
    button.active {background:rgba(180,255,223,.23);border-color:rgba(201,255,219,.68)}
    button:disabled {opacity:.55;cursor:not-allowed}
    .bottom {position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;z-index:9;padding:0 28px;display:flex;align-items:end;justify-content:space-between;gap:24px;pointer-events:none;text-shadow:0 1px 15px rgba(0,0,0,.56)}
    .bottom h1 {margin:0 0 9px;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(35px,5.4vw,76px);line-height:1.05;letter-spacing:-.03em}
    .bottom p {margin:0;color:rgba(244,253,252,.82);font-size:13px;letter-spacing:.015em;max-width:460px;line-height:1.55}
    .hint {display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;background:rgba(4,28,32,.25);padding:10px 12px;border:1px solid rgba(240,252,255,.12);border-radius:999px;backdrop-filter:blur(8px)}
    .dot {display:inline-block;width:7px;height:7px;border-radius:50%;background:#bdffe1;box-shadow:0 0 13px 3px #8affe0;animation:pulse 2s infinite}
    @keyframes pulse {50%{opacity:.35;transform:scale(.7)}}
    .toast {position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(90vw,440px);z-index:15;border-radius:16px;padding:12px 18px;background:rgba(5,26,35,.85);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center;font-size:13px;line-height:1.45;backdrop-filter:blur(10px);opacity:0;transition:opacity .25s;pointer-events:none}
    .toast.visible{opacity:1}
    #video{display:none}
    .portraitHint{display:none}
    @media (max-width:680px) {
      header{align-items:flex-start;padding-top:calc(12px + env(safe-area-inset-top));gap:6px}
      .brand{gap:8px;flex-shrink:0}
      .mark{width:31px;height:31px;font-size:23px}
      .brand strong{font-size:12px;letter-spacing:.15em}
      .brand span{font-size:8px;letter-spacing:.08em}
      .controls{gap:6px;max-width:62vw}
      button{padding:8px 9px;font-size:10px}
      .bottom{padding:0 17px;bottom:calc(16px + env(safe-area-inset-bottom))}
      .bottom h1{font-size:42px}
      .bottom p{font-size:11px;max-width:270px}
      .hint{display:none}
      .portraitHint{display:block;margin-top:7px!important;font-size:10px!important;color:rgba(239,255,250,.60)!important}
    }
    @media (max-width:365px){.brand span{display:none}.controls{max-width:66vw} button{font-size:9px;padding:8px 7px}.bottom h1{font-size:36px}}
    @media (prefers-reduced-motion: reduce) { .dot{animation:none} }
  </style>
</head>
<body>
  <canvas id="world" aria-label="Интерактивный сказочный лес"></canvas>
  <canvas id="glow" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <header>
    <div class="brand"><div class="mark">F</div><div><strong>FAERIA</strong><span>Interactive world</span></div></div>
    <div class="controls">
      <button id="tiltBtn" title="Перспектива при наклоне телефона">↗ Наклон</button>
      <button id="faceBtn" title="Отслеживание лица через камеру">◎ Камера</button>
      <button id="resetBtn" title="Показать движение камеры без датчиков">▶ Демо</button>
      <button id="fullBtn" title="Полный экран">⛶</button>
    </div>
  </header>
  <div class="bottom"><div><h1>Лес между мирами</h1><p>Загляни внутрь волшебного леса. Камера движется в демо-режиме. Для управления наклоном нажми «Наклон».</p><p class="portraitHint">Демо работает сразу. Для управления наклоном нажми «Наклон» и разреши датчики.</p></div><div class="hint"><i class="dot"></i> Живая сцена · Multi-layer 3D · v3</div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <video id="video" autoplay muted playsinline></video>

          quad(objects,[p[0]-w,p[1],p[2]],[p[0]+w,p[1],p[2]],[q[0]+w2,q[1],q[2]],[q[0]-w2,q[1],q[2]],[.11,.35,.30,.19]);
          if(seg%2===0){
            const lx=p[0]-side*(.20+rnd()*.18),ly=p[1]+.18;
            tri(objects,[p[0],p[1],sz+.03],[lx,ly+.22,sz+.07],[lx-side*.21,ly,sz+.16],[.23,.62,.42,.14]);
          }
        }
      }
    }
    // Moss, tiny foreground flowering plants and hanging lantern crystals.
    for(let i=0;i<85;i++){
      const x=(rnd()-.5)*6.2,y=-2.1-rnd()*1.0,z=-2.65-rnd()*1.3;
      if(Math.abs(x)<.45 && rnd()<.6)continue;
      const size=.035+rnd()*.08;
      if(i%3===0)flower(objects,x,y,z,size,i%3);
      else stem(objects,x,y,z,.16+rnd()*.40,.03+rnd()*.05,[.19+rnd()*.15,.50+rnd()*.25,.36,.20]);
      if(i%11===0)crystal(objects,x,y+.10,z,size*1.7,i%2);
    }
    for(let i=0;i<17;i++){
      const x=(rnd()-.5)*6.6,y=-1.9-rnd()*1.5,z=-3.0-rnd()*.6;
      flower(objects,x,y,z,.045+rnd()*.075,i%3);
    }
    for(let i=0;i<6;i++){
      const x=1.2+rnd()*2.0,y=-.7+rnd()*2.5,z=-3.3-rnd()*.9;
      moving.push({x,y,z,size:.075+rnd()*.05,phase:rnd()*6.28,drift:.07+rnd()*.17,type:i%2});

  }
  // One continuous image mesh for body AND reaching arm. Depth varies smoothly,
  // so there are no separately cut sprite edges or torn seams on the shoulder.
  function makePlane(image,distance,subject=false){
    const cols=48,rows=32;
    const positions=[],uvs=[],indices=[];
    const smooth=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
    for(let j=0;j<=rows;j++){
      const v=j/rows;
      for(let i=0;i<=cols;i++){
        const u=i/cols;
        const hand=smooth((.49-u)/.42)*smooth((.68-v)/.60);
        const d=distance-(subject?1.23*hand:0);
        const hh=d*Math.tan(Math.PI/6),hw=hh*1.5;
        positions.push((u*2-1)*hw,(v*2-1)*hh,-d);
        uvs.push(u,v);
      }
    }
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const k=j*(cols+1)+i;
      indices.push(k,k+1,k+cols+1,k+1,k+cols+2,k+cols+1);
    }
    const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(indices),gl.STATIC_DRAW);
    return {vb:buffer(positions),uvb:buffer(uvs),ib,count:indices.length,tex:texture(image)};
  }
  function setup3d(){
    const vert=`attribute vec3 position;attribute vec2 texcoord;uniform mat4 projection;uniform mat4 camera;varying highp vec2 uv;void main(){uv=texcoord;gl_Position=projection*camera*vec4(position,1.);}`;
    const frag=`precision mediump float;varying highp vec2 uv;uniform sampler2D image;uniform float t;void main(){vec4 c=texture2D(image,uv);if(c.a<.025)discard;gl_FragColor=c;}`;
    const cv=`attribute vec3 position;attribute vec4 tint;uniform mat4 projection;uniform mat4 camera;varying lowp vec4 vColor;void main(){vColor=tint;gl_Position=projection*camera*vec4(position,1.);}`;
    const cf=`precision mediump float;varying lowp vec4 vColor;void main(){gl_FragColor=vColor;}`;

    loc={p:gl.getAttribLocation(program,'position'),uv:gl.getAttribLocation(program,'texcoord'),proj:gl.getUniformLocation(program,'projection'),view:gl.getUniformLocation(program,'camera'),image:gl.getUniformLocation(program,'image'),time:gl.getUniformLocation(program,'t')};
    colorLoc={p:gl.getAttribLocation(colorProgram,'position'),c:gl.getAttribLocation(colorProgram,'tint'),proj:gl.getUniformLocation(colorProgram,'projection'),view:gl.getUniformLocation(colorProgram,'camera')};
    gl.clearColor(.021,.074,.090,1);
    initObjects();
    const back=new Image(),mid=new Image();
    back.src=BACKDROP_IMAGE;mid.src=FAIRY_IMAGE;
    Promise.all([back.decode(),mid.decode()]).then(()=>{
      landscape=makePlane(back,7.6);fairyPlane=makePlane(mid,4.5,true);
      ready=true;
    }).catch(err=>{console.error(err);toast('Не удалось подготовить 3D-слои.');});
  }
  function render3d(t){
    if(!ready)return;
    // Limit head movement to avoid seeing past the reconstructed photograph's borders.
    const portrait=W/H<.9, aspect=W/H;
    const defaultY=Math.PI/3;
    const fovY=2*Math.atan(Math.tan(defaultY/2)*Math.min(1,1.5/aspect))*.92;
    const proj=perspective(fovY,aspect,.1,30);
    const cam=view((portrait?-.25:0)+motion.x*.76,-motion.y*.46,.06+headDepth+Math.sin(t*.23)*.012);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.useProgram(program);
    gl.uniformMatrix4fv(loc.proj,false,proj);gl.uniformMatrix4fv(loc.view,false,cam);gl.uniform1f(loc.time,t);
    gl.activeTexture(gl.TEXTURE0);gl.uniform1i(loc.image,0);

    for(const plane of [landscape,fairyPlane]){
      gl.bindTexture(gl.TEXTURE_2D,plane.tex);
      gl.bindBuffer(gl.ARRAY_BUFFER,plane.vb);gl.enableVertexAttribArray(loc.p);
      gl.vertexAttribPointer(loc.p,3,gl.FLOAT,false,0,0);
      gl.bindBuffer(gl.ARRAY_BUFFER,plane.uvb);gl.enableVertexAttribArray(loc.uv);
      gl.vertexAttribPointer(loc.uv,2,gl.FLOAT,false,0,0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,plane.ib);
      gl.drawElements(gl.TRIANGLES,plane.count,gl.UNSIGNED_SHORT,0);
    }
    gl.useProgram(colorProgram);gl.uniformMatrix4fv(colorLoc.proj,false,proj);gl.uniformMatrix4fv(colorLoc.view,false,cam);
    function drawColored(buf,len){gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(colorLoc.p);gl.enableVertexAttribArray(colorLoc.c);gl.vertexAttribPointer(colorLoc.p,3,gl.FLOAT,false,28,0);gl.vertexAttribPointer(colorLoc.c,4,gl.FLOAT,false,28,12);gl.drawArrays(gl.TRIANGLES,0,len/7);}
    drawColored(scenery,objects.length);
    const butterflies=[];butterflyGeometry(butterflies,t);
    if(!kinetic)kinetic=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,kinetic);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(butterflies),gl.DYNAMIC_DRAW);
    drawColored(kinetic,butterflies.length);
  }
  const fallback2d=!gl?canvas.getContext('2d'):null;
  let fallbackImages=null;
  if(gl){try{setup3d();}catch(e){console.error(e);toast('3D-графика недоступна: '+e.message);}}
  else {
    fallbackImages=[BACKDROP_IMAGE,FAIRY_IMAGE].map(uri=>{const img=new Image();img.src=uri;return img;});
    const status=document.querySelector('.hint');if(status)status.innerHTML='<i class="dot"></i> 2.5D-режим · совместимость';
    toast('Включён совместимый 2.5D-режим. Демо движения камеры уже работает.');
  }
  function renderFallback(){
    if(!fallback2d||!fallbackImages||!fallbackImages.every(img=>img.complete&&img.naturalWidth))return;
    const im=fallbackImages[0],scale=Math.max(W/im.width,H/im.height)*1.085;
    const iw=im.width*scale,ih=im.height*scale;
    fallback2d.setTransform(DPR,0,0,DPR,0,0);
    fallback2d.clearRect(0,0,W,H);
    const parallax=[.018,.112];
    for(let i=0;i<fallbackImages.length;i++){
      const x=(W-iw)/2-motion.x*W*parallax[i];
      const y=(H-ih)/2+motion.y*H*parallax[i];
      fallback2d.drawImage(fallbackImages[i],x,y,iw,ih);
    }
  }
  const lights=Array.from({length:112},(_,i)=>({x:Math.random(),y:Math.random(),z:.3+Math.random()*1.2,r:.65+Math.random()*2.2,v:.000025+Math.random()*.000075,t:Math.random()*Math.PI*2,h:i%6===0?43:i%4===0?170:110}));
  function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);sparkCanvas.width=canvas.width;sparkCanvas.height=canvas.height;sctx.setTransform(DPR,0,0,DPR,0,0);if(gl)gl.viewport(0,0,canvas.width,canvas.height);}
  window.addEventListener('resize',resize,{passive:true});resize();
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(ms){
    const t=ms*.001;
    if(mode==='demo'){target.x=Math.sin(t*.56)*.94;target.y=Math.sin(t*.38+.9)*.58;}
    motion.x+=(target.x-motion.x)*.085;motion.y+=(target.y-motion.y)*.085;headDepth+=(wantedDepth-headDepth)*.05;
    if(gl&&ready)render3d(t);else if(!gl)renderFallback();
    sctx.clearRect(0,0,W,H);
    sctx.save();sctx.globalCompositeOperation='screen';
    for(const p of lights.slice(0,W<640?54:112)){
      const x=((p.x + (reduced?0:ms*p.v) + motion.x*p.z*.018)%1.15)*W-W*.06;
      const y=(p.y + motion.y*p.z*.016+ (reduced?0:Math.sin(t*.6+p.t)*.012))*H;
      const a=.2+.36*(.5+.5*Math.sin(t*.9+p.t));
      const r=p.r*(.65+p.z*.7);
      const g=sctx.createRadialGradient(x,y,0,x,y,r*5.5);
      g.addColorStop(0,`hsla(${p.h},100%,89%,${a})`);g.addColorStop(.17,`hsla(${p.h},100%,76%,${a*.65})`);g.addColorStop(1,`hsla(${p.h},100%,65%,0)`);
      sctx.fillStyle=g;sctx.beginPath();sctx.arc(x,y,r*5.5,0,Math.PI*2);sctx.fill();
    }
    sctx.restore();requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  function usePointer(clientX,clientY){if(mode!=='pointer')return;target.x=clamp((clientX/W-.5)*1.9,-1,1);target.y=clamp((clientY/H-.5)*1.7,-1,1);}
  canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||drag){if(mode==='demo')mode='pointer';usePointer(e.clientX,e.clientY);}});
  canvas.addEventListener('pointerdown',e=>{drag=true;mode='pointer';updateButtons();try{canvas.setPointerCapture(e.pointerId)}catch{};usePointer(e.clientX,e.clientY)});
  canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
  function orient(e){if(mode!=='tilt')return;if(e.beta==null||e.gamma==null)return; tiltEventCount++;
    if(!baseline){baseline={beta:e.beta,gamma:e.gamma};}
    const dB=e.beta-baseline.beta,dG=e.gamma-baseline.gamma;
    const wide=W>H;
    target.x=clamp((wide?dB:dG)/22,-1,1);
    target.y=clamp((wide?-dG:dB)/26,-1,1);
  }
  window.addEventListener('deviceorientation',orient,{passive:true});
  tiltBtn.addEventListener('click',async()=>{
    if(mode==='tilt'){mode='pointer';updateButtons();toast('Режим наклона выключен.');return;}
    if(!('DeviceOrientationEvent' in window)){toast('На этом устройстве нет доступа к датчику ориентации.');return;}
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      try{const granted=await DeviceOrientationEvent.requestPermission();if(granted!=='granted'){toast('Разрешение на датчики отклонено.');return;}}catch(e){toast('Разрешение на датчики недоступно. Нужен HTTPS.');return;}
    }
    await stopCamera();mode='tilt';baseline=null;tiltEventCount=0;updateButtons();toast('Наклоняйте телефон — перспектива будет изменяться.');setTimeout(()=>{if(mode==='tilt'&&tiltEventCount===0)toast('Датчики движения не передают данные. Откройте сайт в Safari и разрешите доступ.');},2600);
  });
  function externalScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
  async function stopCamera(){if(camera){try{camera.stop()}catch{}camera=null;}const v=document.getElementById('video');if(v.srcObject){for(const tr of v.srcObject.getTracks())tr.stop();v.srcObject=null;}if(faceDetector){try{faceDetector.close()}catch{}faceDetector=null;}}
  faceBtn.addEventListener('click',async()=>{
    if(mode==='face'){await stopCamera();mode='pointer';updateButtons();toast('Камера выключена.');return;}
    if(!navigator.mediaDevices?.getUserMedia){toast('Доступ к камере доступен только на HTTPS или localhost.');return;}
    faceBtn.disabled=true;faceBtn.textContent='Подключение…';
    try{
      if(!window.FaceDetection)await externalScript('https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js');
      if(!window.Camera)await externalScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js');
      await stopCamera();
      const v=document.getElementById('video');
      faceDetector=new window.FaceDetection({locateFile:(f)=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/'+f});
      faceDetector.setOptions({model:'short',minDetectionConfidence:.58});
      faceDetector.onResults(r=>{
        const b=r.detections?.[0]?.boundingBox;
        if(b&&mode==='face'){
          target.x=clamp((b.xCenter-.5)*2.1,-1,1);
          target.y=clamp((b.yCenter-.5)*1.9,-1,1);
          wantedDepth=clamp(((b.width||.25)-.25)*1.25,-.15,.28);
        }
      });
      camera=new window.Camera(v,{onFrame:async()=>{if(mode==='face')await faceDetector.send({image:v})},width:320,height:240});
      mode='face';updateButtons();await camera.start();toast('Камера отслеживает положение лица локально в браузере.');
    }catch(e){console.error(e);await stopCamera();mode='pointer';updateButtons();toast('Не удалось запустить отслеживание лица. Используйте мышь или наклон.');}
    finally{faceBtn.disabled=false;faceBtn.textContent='◎ Камера';}
  });
  resetBtn.addEventListener('click',async()=>{await stopCamera();mode='demo';baseline=null;target={x:0,y:0};wantedDepth=0;updateButtons();toast('Демонстрация движения камеры включена.');});
  fullBtn.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('Полноэкранный режим недоступен в этом браузере.')}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='face'){stopCamera();mode='pointer';updateButtons();}});
  updateButtons();
})();
</script>
