name: Publish Faeria (dev)

on:
  push:
    branches: [dev]
    paths:
      - index.html
      - .github/workflows/faeria-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: faeria-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
      - name: Prepare only Faeria website
        run: |
          mkdir -p "$RUNNER_TEMP/faeria-site"
          cp index.html "$RUNNER_TEMP/faeria-site/index.html"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/faeria-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
