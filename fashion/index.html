<script>
(()=>{
'use strict';
const stage=document.getElementById('stage'),room=document.getElementById('room'),subject=document.getElementById('subject'),typography=document.getElementById('typography'),tilt=document.getElementById('tiltBtn'),demoBtn=document.getElementById('demoBtn'),hint=document.getElementById('hint');
let x=0,y=0,tx=0,ty=0,auto=!matchMedia('(prefers-reduced-motion: reduce)').matches,tilting=false,neutral=null,frame=0,activateAt=performance.now(),lastInput=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function draw(t){
  if(auto && !tilting && t-lastInput>3500){tx=Math.sin((t-activateAt)/2100)*.63;ty=Math.cos((t-activateAt)/2650)*.30;}
  x+=(tx-x)*.075; y+=(ty-y)*.075;
  const size=stage.getBoundingClientRect().width||450;
  const p=size/800;
  // Retain a single state of truth for every plane.
  stage.style.transform=`rotateY(${x*5.2}deg) rotateX(${-y*3.6}deg)`;
  room.style.transform=`translate3d(${(-x*8*p).toFixed(2)}px,${(-y*6*p).toFixed(2)}px,-85px) scale(1.14)`;
  subject.style.transform=`translate3d(${(-x*25*p).toFixed(2)}px,${(-y*18*p).toFixed(2)}px,26px) scale(1.10)`;
  typography.style.transform=`translate3d(${(-x*58*p).toFixed(2)}px,${(-y*38*p).toFixed(2)}px,95px) scale(1.06)`;
  frame=requestAnimationFrame(draw);
}
frame=requestAnimationFrame(draw);
function setPointer(px,py){const r=stage.getBoundingClientRect();tx=clamp((px-r.left-r.width/2)/(r.width*.5),-1,1);ty=clamp((py-r.top-r.height/2)/(r.height*.5),-1,1);lastInput=performance.now();}
window.addEventListener('pointermove',e=>{if(!tilting && (e.pointerType==='mouse'||e.buttons>0))setPointer(e.clientX,e.clientY)},{passive:true});
window.addEventListener('touchmove',e=>{if(tilting)return;const p=e.touches[0];if(p)setPointer(p.clientX,p.clientY)},{passive:true});
window.addEventListener('pointerdown',e=>{if(!tilting)setPointer(e.clientX,e.clientY)});
function onOrientation(e){if(e.gamma==null||e.beta==null)return;if(!neutral)neutral={gamma:e.gamma,beta:e.beta};tx=clamp((e.gamma-neutral.gamma)/22,-1,1);ty=clamp((e.beta-neutral.beta)/19,-1,1)}
tilt.addEventListener('click',async()=>{
 if(tilting){window.removeEventListener('deviceorientation',onOrientation,true);tilting=false;neutral=null;tilt.textContent='Наклон телефона';hint.textContent='Проведи по экрану — слои движутся отдельно';return;}
 try{if(typeof DeviceOrientationEvent==='undefined')throw Error('На устройстве нет датчика');if(typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('Нет разрешения');}
   neutral=null;window.addEventListener('deviceorientation',onOrientation,true);tilting=true;auto=false;demoBtn.dataset.active='false';demoBtn.textContent='Автодемо: выкл.';tilt.textContent='Наклон: включён';hint.textContent='Наклоняй телефон для смены ракурса';
 }catch(err){hint.textContent='Датчики недоступны: двигай пальцем';}
});
demoBtn.addEventListener('click',()=>{auto=!auto;lastInput=0;activateAt=performance.now();tilting=false;neutral=null;window.removeEventListener('deviceorientation',onOrientation,true);tilt.textContent='Наклон телефона';demoBtn.dataset.active=String(auto);demoBtn.textContent='Автодемо: '+(auto?'вкл.':'выкл.');if(!auto){tx=0;ty=0;}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(frame);else frame=requestAnimationFrame(draw)});
})();
</script></body></html>
